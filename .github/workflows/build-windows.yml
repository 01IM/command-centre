name: Build Windows app

# Runs automatically on every push to main (and can be started by hand from the Actions tab).
# Produces "Command Centre_x.y.z_x64-setup.exe" and publishes it as a GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build installer and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: v__VERSION__-build${{ github.run_number }}
          releaseName: Command Centre v__VERSION__ (build ${{ github.run_number }})
          releaseBody: Download the file ending in "-setup.exe" below and run it.
          releaseDraft: false
          prerelease: false
